<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Policy Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Policy Prep</title>
<style>
  :root{
    --bg:#11141a; --panel:#181c24; --line:#2b323e; --ink:#e8ecf3; --dim:#98a2b3;
    --accent:#4da3ff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f0b429;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  button{font:inherit;border:0;border-radius:11px;padding:14px 18px;background:var(--accent);
    color:#06101d;font-weight:600;width:100%;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  button:disabled{opacity:.45}
  .stack > * + *{margin-top:9px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#20503c}
  .pill.warn{color:var(--warn);border-color:#4d3d12}
  .bar{height:6px;background:#222833;border-radius:6px;overflow:hidden;margin:10px 0 0}
  .bar > i{display:block;height:100%;background:var(--accent);transition:width .2s}
  .choice{display:block;text-align:left;background:#141821;border:1px solid var(--line);
    color:var(--ink);border-radius:12px;padding:14px;margin:8px 0;font-weight:400;
    width:100%;font-size:15.5px;line-height:1.45}
  .choice.right{border-color:var(--ok);background:#132a20}
  .choice.wrong{border-color:var(--bad);background:#2a1616}
  .stem{font-size:17px;margin:2px 0 14px;white-space:pre-wrap}
  .feedback{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-top:12px;
    font-size:14px;color:var(--dim)}
  .feedback b{color:var(--ink)}
  .cite{font-style:italic;margin-top:6px;color:#7e8899}
  .meta{color:var(--dim);font-size:13px}
  .big{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.1}
  .hide{display:none}
  ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
  .mini{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .num{font-size:22px;font-weight:700;line-height:1.1}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
  .track{height:8px;background:#222833;border-radius:8px;overflow:hidden;margin-top:10px;display:flex}
  .track i{display:block;height:100%}
  .seg-ok{background:var(--ok)} .seg-part{background:var(--warn)} .seg-none{background:#2b323e}
  .keylist{margin-top:8px;font-size:13px;color:var(--dim)}
  .keylist div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
    border-bottom:1px solid #20252e}
  .keylist div:last-child{border-bottom:0}
  .bad{color:var(--bad)} .good{color:var(--ok)}
  button.small{width:auto;padding:9px 14px;font-size:13px}
  input[type=email],input[type=password]{width:100%;background:#141821;color:var(--ink);
    border:1px solid var(--line);border-radius:11px;padding:14px;font:16px/1.3 inherit}
  input:focus{outline:none;border-color:var(--accent)}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <div id="auth" class="hide">
    <h1>Policy Prep</h1>
    <p class="sub">Sign in once. After that it stays signed in and pulls new policies by itself.</p>
    <div class="card stack">
      <!-- autocapitalize/autocorrect off: iOS will happily capitalise the first letter
           of an email or "helpfully" correct a password, and the resulting failure looks
           like bad credentials rather than a keyboard doing it. -->
      <input type="email" id="email" placeholder="Email" autocomplete="username"
             inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false">
      <input type="password" id="password" placeholder="Password"
             autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button id="signin">Sign in</button>
      <button id="signup" class="ghost">Create an account</button>
      <div class="meta" id="authmsg"></div>
    </div>
  </div>

  <div id="home" class="hide">
    <h1>Policy Prep</h1>
    <p class="sub" id="homesub">One policy at a time.</p>
    <div id="overall"></div>
    <div id="policies"></div>
    <div class="card stack">
      <button id="start">Start a session</button>
      <button id="tostats" class="ghost">Full breakdown</button>
      <button id="resync" class="ghost">Check for new policies</button>
      <div class="meta" id="syncmsg"></div>
    </div>
    <div class="card stack">
      <div class="meta" id="whoami"></div>
      <div class="mini" id="version"></div>
      <button id="signout" class="ghost">Sign out</button>
    </div>
  </div>

  <div id="stats" class="hide">
    <h1>Breakdown</h1>
    <p class="sub">Where you actually stand, per policy and per item.</p>
    <div id="statsbody"></div>
    <div class="card stack">
      <button id="statsback" class="ghost">Back</button>
    </div>
  </div>

  <div id="quiz" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <span class="meta" id="counter"></span><span class="meta" id="running"></span>
      </div>
      <div class="bar"><i id="prog" style="width:0"></i></div>
    </div>
    <div class="card">
      <div class="stem" id="stem"></div>
      <div id="choices"></div>
      <div class="feedback hide" id="feedback"></div>
    </div>
    <div class="card stack">
      <button id="next" class="hide">Next</button>
      <button id="quit" class="ghost">End session</button>
    </div>
  </div>

  <div id="result" class="hide">
    <div class="card">
      <div class="big" id="score"></div>
      <div class="meta" id="scoreline"></div>
      <div id="gatebox" style="margin-top:14px"></div>
    </div>
    <div class="card stack">
      <button id="again">Another session</button>
      <button id="home2" class="ghost">Back</button>
    </div>
  </div>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
